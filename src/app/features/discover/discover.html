<div class="ul-container-gallery">
  <div class="ul-content ul-pt-8">
    <ng-container *transloco="let t">
      <h1 class="ul-typography-headline-xl-extrablack ul-mb-6">{{ t('discover.title') }}</h1>

      <um-search-location-bar
        [searchLocation]="searchLocationService.searchLocation()"
        [pickerSuggestions]="locationSuggestions()"
        [isResolvingCurrentLocation]="isResolvingCurrentLocation()"
        [radiusOptions]="radiusOptions()"
        [changeLocationLabel]="t('location.changeLocation')"
        [firstRunTitle]="t('location.firstRunTitle')"
        [locationPickerPlaceholder]="t('location.searchPlaceholder')"
        [useCurrentLocationLabel]="t('location.useCurrentLocationLabel')"
        [radiusLabel]="t('location.searchRadiusLabel')"
        [withinRadiusLabel]="withinRadiusLabel()"
        (queryChanged)="onLocationQueryChanged($event)"
        (areaSelected)="onAreaSelected($event)"
        (radiusChanged)="onRadiusChanged($event)"
        (useCurrentLocationRequested)="onUseCurrentLocationRequested()"
      />

      <div class="ul-gap-4 ul-mb-6" style="display: flex; align-items: center; flex-wrap: wrap">
        <div class="ul-gap-2" style="display: flex; flex-wrap: wrap; flex: 1">
          <ul-pill
            variant="interactive"
            [theme]="selectedCategory() === null ? 'fill-purple' : 'transparent-white'"
            (click)="selectCategory(null)"
          >
            {{ t('discover.allCategories') }}
          </ul-pill>
          @for (category of categories; track category) {
            <ul-pill
              variant="interactive"
              [theme]="selectedCategory() === category ? 'fill-purple' : 'transparent-white'"
              (click)="selectCategory(category)"
            >
              {{ category }}
            </ul-pill>
          }
        </div>
        <um-sort
          [placeholder]="t('listing.sortPlaceholder')"
          [sortOptions]="sortOptions()"
          [(sort)]="sortOption"
        />
      </div>

      <um-listing-grid [listings]="sortedListings()" [emptyStateText]="t('discover.emptyState')" />
    </ng-container>
  </div>
</div>
