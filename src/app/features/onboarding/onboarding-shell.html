<ng-container *transloco="let t">
  <div class="um-onboarding">
    <ul-navbar variant="minimal" logoSrc="assets/img/logo.png" logoAlt="Undermarket" />
    <div class="um-onboarding__header">
      <div class="um-onboarding__header-inner">

        <ul-stepper
          [totalSteps]="onboardingProgress.totalSteps"
          [currentStep]="onboardingProgress.currentStep()"
          [labels]="[
            t('onboarding.stepLabels.name'),
            t('onboarding.stepLabels.photo'),
            t('onboarding.stepLabels.location'),
          ]"
          [ariaLabel]="t('onboarding.stepperAriaLabel')"
        />
      </div>
    </div>
    <div class="um-onboarding__body">
      <router-outlet />
    </div>
  </div>
</ng-container>
