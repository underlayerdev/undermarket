<ng-container *transloco="let t">
  <div class="um-onboarding">
    <ul-navbar variant="minimal" logoSrc="assets/img/logo.png" logoAlt="Undermarket" />

    <div class="um-onboarding__stepper">
      <ul-stepper
        [totalSteps]="onboardingService.totalSteps"
        [currentStep]="onboardingService.stepperPosition()"
        [labels]="onboardingService.stepperLabels()"
        [ariaLabel]="t('onboarding.stepperAriaLabel')"
      />
    </div>

    <div class="um-onboarding__body">
      <router-outlet />
    </div>

    <div class="um-onboarding__footer">
      <um-onboarding-footer />
    </div>
  </div>
</ng-container>
