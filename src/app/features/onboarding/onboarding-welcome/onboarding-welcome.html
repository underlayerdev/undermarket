<ng-container *transloco="let t">
  <div class="um-onboarding__welcome">
    <ul-navbar variant="minimal" logoSrc="assets/img/logo.png" logoAlt="Undermarket" />

    <div class="um-onboarding__welcome-content">
      <img
        class="um-onboarding__welcome-hero"
        src="assets/img/onboarding/welcome.png"
        alt=""
        aria-hidden="true"
      />

      <div>
        <h1 class="ul-typography-headline-l-extrablack">{{ t('onboarding.welcome.title') }}</h1>
        <span class="ul-typography-brand-headline-xl-extrablack ul-text-primary">UNDERMARKET</span>
             <p class="ul-typography-body-l-regular ul-text-secondary">
          {{ t('onboarding.welcome.slogan') }}
        </p>
        <p class="ul-typography-body-m-regular ul-text-secondary ul-mt-8">
          {{ t('onboarding.welcome.subtitle') }}
        </p>
      </div>
    </div>

    <div class="um-onboarding__welcome-footer">
      <ul-button theme="fill-purple" size="lg" (buttonClick)="startOnboarding()">
        {{ onboardingService.continueLabel() }}
      </ul-button>
    </div>
  </div>
</ng-container>
