<div class="ul-container-gallery">
  <div class="ul-content" style="padding-top: 2rem;">

    @if (isLoading()) {
      <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem;">
        <ul-skeleton variant="rect" width="80px" height="80px" [show]="true" />
        <ul-skeleton variant="text" [lines]="2" [show]="true" />
      </div>
      <ul-skeleton variant="rect" height="200px" [show]="true" />
    } @else if (userService.profile(); as user) {

      <div style="display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2.5rem;">
        <ul-avatar [initials]="avatarInitials()" [src]="avatarSrc()" size="xl" />
        <div>
          <h1 class="ul-typography-headline-l-extrablack">{{ user.displayName }}</h1>
          <p class="ul-typography-body-m-regular" style="opacity: 0.6;">{{ user.email }}</p>
        </div>
      </div>

      <h2 class="ul-typography-headline-m-extrabold" style="margin-bottom: 1.5rem;">
        My listings ({{ userListings().length }})
      </h2>

      @if (userListings().length === 0) {
        <p class="ul-typography-body-m-regular" style="opacity: 0.6;">You have not posted any listings yet.</p>
      } @else {
        <div class="ul-row">
          @for (listing of userListings(); track listing.id) {
            <div class="ul-col-12 ul-col-md-4 ul-col-lg-3">
              <a [routerLink]="['/listings', createListingSlug(listing.title, listing.id)]">
                <ul-card
                  [cardTitle]="listing.title"
                  [cardSubtitle]="'€' + listing.price"
                  [cardCaption]="listing.category"
                  cardDirection="vertical"
                />
              </a>
              <ul-status [status]="listing.status === 'active' ? 'confirm' : 'alert'" />
            </div>
          }
        </div>
      }

    }
  </div>
</div>
