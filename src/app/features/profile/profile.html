<div class="um-profile">
  <div class="ul-content ul-pt-8">
    @if (currentUser(); as user) {
      <um-profile-info [user]="user" />
      <um-profile-listings [ownerId]="user.id" />
    } @else {
      <div class="ul-gap-4 ul-mb-6" style="display: flex; align-items: center">
        <ul-skeleton variant="rect" width="80px" height="80px" [show]="true" />
        <ul-skeleton variant="text" [lines]="2" [show]="true" />
      </div>
      <ul-skeleton variant="rect" height="200px" [show]="true" />
    }
  </div>
</div>
