<ng-container *transloco="let t">
  <ul-hero
    [title]="t('home.heroTitle')"
    [subtitle]="t('home.heroSubtitle')"
    [primaryAction]="heroPrimaryAction()"
    size="md"
    alignment="left"
  />

  <section class="ul-container-fluid">
    <div class="ul-content">
      <h2 class="ul-typography-headline-m-extrabold ul-mb-2">{{ t('home.latestListings') }}</h2>

      <um-listing-grid
        [listings]="store.results()"
        [isLoading]="store.isLoading()"
        [emptyStateText]="t('home.emptyState')"
      />
    </div>
  </section>
</ng-container>
