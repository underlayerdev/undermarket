<ng-container *transloco="let t">
  <div class="search__mobile-header md:ul-hidden ul-container-gallery">
    <ul-button
      type="button"
      theme="ghost-white"
      [iconOnly]="true"
      [ariaLabel]="t('common.back')"
      (buttonClick)="goBack()"
    >
      <ul-icon icon="arrow_left" size="6" weight="bold" />
    </ul-button>
    <ul-search-input
      class="search__mobile-input"
      [placeholder]="t('common.searchPlaceholder')"
      [suggestions]="recentSearchSuggestions()"
      [suggestionsLabel]="t('common.recentSearchesLabel')"
      [backLabel]="t('common.back')"
      [clearLabel]="t('common.clear')"
      [(value)]="query"
      (searchSubmit)="onSearchSubmit($event)"
      (suggestionSelected)="onSuggestionSelected($event)"
    />
  </div>

  <div class="ul-container-gallery">
    <div class="ul-content ul-pt-8">
      <h1 class="ul-typography-headline-xl-extrablack ul-mb-6 search__desktop-title">
        {{ t('search.title') }}
      </h1>

      <um-search-location-bar
        [searchLocation]="searchLocationService.searchLocation()"
        [pickerSuggestions]="locationSuggestions()"
        [isResolvingCurrentLocation]="isResolvingCurrentLocation()"
        [radiusOptions]="radiusOptions()"
        [changeLocationLabel]="t('location.changeLocation')"
        [firstRunTitle]="t('location.firstRunTitle')"
        [locationPickerPlaceholder]="t('location.searchPlaceholder')"
        [useCurrentLocationLabel]="t('location.useCurrentLocationLabel')"
        [radiusLabel]="t('location.searchRadiusLabel')"
        [withinRadiusLabel]="withinRadiusLabel()"
        (queryChanged)="onLocationQueryChanged($event)"
        (areaSelected)="onAreaSelected($event)"
        (radiusChanged)="onRadiusChanged($event)"
        (useCurrentLocationRequested)="onUseCurrentLocationRequested()"
      />

      <div class="ul-row ul-mb-4">
        <div class="ul-col-12 ul-col-md-6 search__desktop-search-col">
          <ul-search-input
            [placeholder]="t('common.searchPlaceholder')"
            [suggestions]="recentSearchSuggestions()"
            [suggestionsLabel]="t('common.recentSearchesLabel')"
            [backLabel]="t('common.back')"
            [clearLabel]="t('common.clear')"
            [(value)]="query"
            (searchSubmit)="onSearchSubmit($event)"
            (suggestionSelected)="onSuggestionSelected($event)"
          />
        </div>
        <div class="ul-col-12 ul-col-md-4">
          <ul-select
            [label]="t('search.categoryLabel')"
            [placeholder]="t('search.allCategoriesPlaceholder')"
            [options]="categoryOptions"
            [(value)]="selectedCategory"
          />
        </div>
        <div class="ul-col-12 ul-col-md-2" style="display: flex; align-items: flex-end">
          <ul-button theme="fill-purple" size="md" type="button" (buttonClick)="onSearch()">{{
            t('search.searchButton')
          }}</ul-button>
        </div>
      </div>

      <div class="ul-gap-4 ul-mb-4" style="display: flex; align-items: center; flex-wrap: wrap">
        @if (selectedCategory()) {
          <div class="ul-gap-2" style="display: flex; align-items: center">
            <span class="ul-typography-caption-l-regular">{{ t('search.activeFilter') }}</span>
            <ul-pill theme="fill-purple" variant="dismissible" (dismiss)="clearCategory()">
              {{ selectedCategory() }}
            </ul-pill>
          </div>
        }
        <um-sort
          class="ul-ml-auto"
          [placeholder]="t('listing.sortPlaceholder')"
          [sortOptions]="sortOptions()"
          [(sort)]="sortOption"
        />
      </div>

      <um-listing-grid [listings]="sortedListings()" [emptyStateText]="t('search.emptyState')" />
    </div>
  </div>
</ng-container>
