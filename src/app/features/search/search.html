<div class="ul-container-gallery">
  <div class="ul-content" style="padding-top: 2rem;">

    <h1 class="ul-typography-headline-xl-extrablack" style="margin-bottom: 1.5rem;">Search listings</h1>

    <div class="ul-row" style="margin-bottom: 1rem;">
      <div class="ul-col-12 ul-col-md-6">
        <ul-input label="Search" placeholder="Search for anything..." [(value)]="query" />
      </div>
      <div class="ul-col-12 ul-col-md-4">
        <ul-select label="Category" placeholder="All categories" [options]="categoryOptions" [(value)]="selectedCategory" />
      </div>
      <div class="ul-col-12 ul-col-md-2" style="display: flex; align-items: flex-end;">
        <ul-button theme="fill-purple" size="md" type="button" (buttonClick)="onSearch()">Search</ul-button>
      </div>
    </div>

    @if (selectedCategory()) {
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center;">
        <span class="ul-typography-caption-l-regular">Active filter:</span>
        <ul-pill theme="fill-purple" variant="dismissible" (dismiss)="clearCategory()">
          {{ selectedCategory() }}
        </ul-pill>
      </div>
    }

    @if (listingService.listings().length === 0) {
      <p class="ul-typography-body-m-regular" style="opacity: 0.6; margin-top: 2rem;">No results found. Try a different search.</p>
    } @else {
      <div class="ul-row">
        @for (listing of listingService.listings(); track listing.id) {
          <div class="ul-col-12 ul-col-md-4 ul-col-lg-3">
            <a [routerLink]="['/listings', createListingSlug(listing.title, listing.id)]">
              <ul-card
                [cardTitle]="listing.title"
                [cardSubtitle]="'€' + listing.price"
                [cardCaption]="listing.category"
                cardDirection="vertical"
              />
            </a>
          </div>
        }
      </div>
    }

  </div>
</div>
