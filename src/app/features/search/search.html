<div class="ul-container-gallery">
  <div class="ul-content ul-pt-8">
    <h1 class="ul-typography-headline-xl-extrablack ul-mb-6" i18n="@@search.title">
      Search listings
    </h1>

    <div class="ul-row ul-mb-4">
      <div class="ul-col-12 ul-col-md-6">
        <ul-input
          label="Search"
          i18n-label="@@search.searchLabel"
          placeholder="Search for anything..."
          i18n-placeholder="@@common.searchPlaceholder"
          [(value)]="query"
        />
      </div>
      <div class="ul-col-12 ul-col-md-4">
        <ul-select
          label="Category"
          i18n-label="@@search.categoryLabel"
          placeholder="All categories"
          i18n-placeholder="@@search.allCategoriesPlaceholder"
          [options]="categoryOptions"
          [(value)]="selectedCategory"
        />
      </div>
      <div class="ul-col-12 ul-col-md-2" style="display: flex; align-items: flex-end">
        <ul-button theme="fill-purple" size="md" type="button" (buttonClick)="onSearch()"
          ><ng-container i18n="@@search.searchButton">Search</ng-container></ul-button
        >
      </div>
    </div>

    @if (selectedCategory()) {
      <div class="ul-gap-2 ul-mb-4" style="display: flex; align-items: center">
        <span class="ul-typography-caption-l-regular" i18n="@@search.activeFilter">
          Active filter:
        </span>
        <ul-pill theme="fill-purple" variant="dismissible" (dismiss)="clearCategory()">
          {{ selectedCategory() }}
        </ul-pill>
      </div>
    }

    @if (listingService.listings().length === 0) {
      <p class="ul-typography-body-m-regular ul-text-secondary ul-mt-8" i18n="@@search.emptyState">
        No results found. Try a different search.
      </p>
    } @else {
      <div class="ul-row">
        @for (listing of listingService.listings(); track listing.id) {
          <div class="ul-col-12 ul-col-md-4 ul-col-lg-3">
            <a [routerLink]="['/listings', createListingSlug(listing.title, listing.id)]">
              <ul-card
                [cardTitle]="listing.title"
                [cardSubtitle]="listing.price | listingPrice: listing.currency"
                [cardCaption]="listing.category"
                cardDirection="vertical"
              />
            </a>
          </div>
        }
      </div>
    }
  </div>
</div>
