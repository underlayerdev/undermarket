<ng-container *transloco="let t">
  <div class="search__mobile-header md:ul-hidden ul-container-gallery">
    <ul-button
      type="button"
      theme="ghost-white"
      [iconOnly]="true"
      [ariaLabel]="t('common.back')"
      (buttonClick)="goBack()"
    >
      <ul-icon icon="arrow_left" size="6" weight="bold" />
    </ul-button>
    <ul-search-input
      class="search__mobile-input"
      [placeholder]="t('common.searchPlaceholder')"
      [suggestions]="recentSearchSuggestions()"
      [suggestionsLabel]="t('common.recentSearchesLabel')"
      [backLabel]="t('common.back')"
      [clearLabel]="t('common.clear')"
      [(value)]="query"
      (searchSubmit)="onSearchSubmit($event)"
      (suggestionSelected)="onSuggestionSelected($event)"
    />
  </div>

  <div class="ul-container-gallery">
    <div class="ul-content ul-pt-8">
      <h1 class="ul-typography-headline-xl-extrablack ul-mb-6 search__desktop-title">
        {{ t('search.title') }}
      </h1>

      <um-search-location-bar (locationErrorOccurred)="onLocationError($event)" />

      <div class="ul-row ul-mb-4">
        <div class="ul-col-12 ul-col-md-8 search__desktop-search-col">
          <ul-search-input
            [placeholder]="t('common.searchPlaceholder')"
            [suggestions]="recentSearchSuggestions()"
            [suggestionsLabel]="t('common.recentSearchesLabel')"
            [backLabel]="t('common.back')"
            [clearLabel]="t('common.clear')"
            [(value)]="query"
            (searchSubmit)="onSearchSubmit($event)"
            (suggestionSelected)="onSuggestionSelected($event)"
          />
        </div>
        <div class="ul-col-12 ul-col-md-4 search__desktop-search-button-col">
          <ul-button theme="fill-purple" size="md" type="button" (buttonClick)="onSearch()">{{
            t('search.searchButton')
          }}</ul-button>
        </div>
      </div>

      <div class="search__filters-row ul-gap-4 ul-mb-4">
        <div class="search__category-filter">
          <um-category-filter-chips
            [allLabel]="t('search.allCategoriesPlaceholder')"
            [showMoreLabel]="t('common.showMore')"
          />
        </div>
        <um-sort
          [placeholder]="t('listing.sortPlaceholder')"
          [sortOptions]="sortOptions()"
          [sort]="store.sort()"
          (sortChange)="onSortChange($event)"
        />
      </div>

      <um-listing-grid
        [listings]="store.results()"
        [isLoading]="store.isLoading()"
        [emptyStateText]="t('search.emptyState')"
      />
    </div>
  </div>
</ng-container>
