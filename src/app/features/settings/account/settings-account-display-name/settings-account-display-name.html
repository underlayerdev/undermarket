<div class="settings__panel ul-mt-6" *transloco="let t">
  <h2 class="ul-typography-headline-s-extrabold ul-mb-4">
    {{ t('settings.displayNameLabel') }}
  </h2>
  <form
    class="settings-account__form ul-gap-4"
    (submit)="$event.preventDefault(); onSaveDisplayName()"
  >
    <ul-input
      [label]="t('settings.displayNameLabel')"
      [required]="true"
      [(value)]="displayNameValue"
      [error]="!!displayNameError()"
      [errorText]="displayNameError()"
    />
    <ul-button type="submit" theme="fill-purple" size="md" [disabled]="store.isSavingDisplayName()">
      {{ saveDisplayNameButtonLabel() }}
    </ul-button>
  </form>
</div>
