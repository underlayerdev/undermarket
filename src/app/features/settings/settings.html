<div class="ul-container-form">
  <div class="ul-content" style="padding-top: 2rem;">

    <h1 class="ul-typography-headline-xl-extrablack" style="margin-bottom: 2rem;">Settings</h1>

    <div style="display: flex; flex-direction: column; gap: 1.5rem;">

      <ul-card cardTitle="Appearance" cardDirection="vertical">
        <ul-select
          label="Theme"
          placeholder="Select theme"
          [options]="themeOptions"
          [(value)]="themeValue"
          (valueChange)="onThemeChange($event)"
        />
      </ul-card>

      <ul-card cardTitle="Language" cardDirection="vertical">
        <ul-select
          label="Display language"
          placeholder="Select language"
          [options]="languageOptions"
          [(value)]="languageValue"
          (valueChange)="onLanguageChange($event)"
        />
      </ul-card>

    </div>
  </div>
</div>
