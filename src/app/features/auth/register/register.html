<ng-container *transloco="let t">
  <h1 class="ul-typography-headline-l-extrablack ul-mb-1 auth-title">{{ t('register.title') }}</h1>
  <p class="ul-typography-body-m-regular ul-mb-6 ul-text-secondary auth-subtitle">
    {{ t('register.subtitle') }}
  </p>

  <div class="ul-gap-4 auth-form">
    <ul-input
      [label]="t('login.emailLabel')"
      placeholder="you@example.com"
      type="email"
      [required]="true"
      [(value)]="emailValue"
      [error]="!!emailError()"
      [errorText]="emailError()"
    />

    <ul-input
      [label]="t('common.passwordLabel')"
      [placeholder]="t('register.passwordPlaceholder')"
      type="password"
      [required]="true"
      [(value)]="passwordValue"
      [error]="!!passwordError()"
      [errorText]="passwordError()"
    />

    <ul-input
      [label]="t('register.confirmPasswordLabel')"
      [placeholder]="t('register.confirmPasswordPlaceholder')"
      type="password"
      [required]="true"
      [(value)]="confirmPasswordValue"
      [error]="!!confirmPasswordError()"
      [errorText]="confirmPasswordError()"
    />

    @if (errorMessage(); as msg) {
      <div
        role="alert"
        class="ul-py-2 ul-px-3 ul-bg-grey-lvl-1 ul-border-red ul-rounded-3 ul-text-red auth-form__error-banner"
      >
        {{ msg }}
      </div>
    }

    <ul-button
      theme="fill-purple"
      size="md"
      type="button"
      [disabled]="isLoading()"
      (buttonClick)="onRegister()"
    >
      {{ registerButtonLabel() }}
    </ul-button>

    <div class="ul-gap-3 ul-text-tertiary auth-form__divider">
      <span>{{ t('common.or') }}</span>
    </div>

    <um-google-sign-in-button />

    <p class="ul-typography-caption-l-regular ul-text-secondary auth-form__footer">
      {{ t('register.hasAccountText') }}
      <a routerLink="/login">{{ t('register.signInLink') }}</a>
    </p>
  </div>
</ng-container>
