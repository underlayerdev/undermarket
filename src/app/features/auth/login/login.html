<div class="ul-container-form">
  <div class="ul-content">
    <div class="ul-shadow-md ul-rounded-lg" style="padding: 2rem; max-width: 480px; margin: 4rem auto;">

      <img src="assets/img/logo.png" alt="Undermarket" height="40" style="margin-bottom: 1.5rem; display: block;" />

      <h1 class="ul-typography-headline-l-extrablack">Welcome to Undermarket</h1>
      <p class="ul-typography-body-m-regular" style="margin-bottom: 1.5rem;">Sign in to your account or create a new one.</p>

      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <ul-input
          label="Email"
          placeholder="you@example.com"
          [required]="true"
          [(value)]="emailValue"
          [error]="!!emailError()"
          [errorText]="emailError()"
        />

        <ul-input
          label="Password"
          placeholder="Min. 6 characters"
          [required]="true"
          [(value)]="passwordValue"
          [error]="!!passwordError()"
          [errorText]="passwordError()"
        />

        @if (errorMessage(); as msg) {
          <div role="alert" class="ul-typography-caption-l-regular" style="color: red;">{{ msg }}</div>
        }

        <ul-button theme="fill-purple" size="md" type="button" [disabled]="isLoading()" (buttonClick)="onLogin()">
          {{ isLoading() ? 'Signing in...' : 'Sign In' }}
        </ul-button>

        <ul-button theme="outline-purple" size="md" type="button" [disabled]="isLoading()" (buttonClick)="onRegister()">
          Create Account
        </ul-button>

        <p class="ul-typography-caption-l-regular" style="text-align: center; opacity: 0.6;">or</p>

        <ul-button theme="ghost-white" size="md" type="button" [disabled]="isLoading()" (buttonClick)="onGoogleLogin()">
          Continue with Google
        </ul-button>
      </div>

    </div>
  </div>
</div>
