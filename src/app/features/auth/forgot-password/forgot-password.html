@if (!successMessage()) {
  <h1 class="ul-typography-headline-l-extrablack ul-mb-1 auth-title" i18n="@@forgotPassword.title">
    Reset your password
  </h1>
  <p
    class="ul-typography-body-m-regular ul-mb-6 ul-text-secondary auth-subtitle"
    i18n="@@forgotPassword.subtitle"
  >
    Enter your email and we'll send you a link to reset your password.
  </p>

  <div class="ul-gap-4 auth-form">
    <ul-input
      label="Email"
      i18n-label="@@login.emailLabel"
      placeholder="you@example.com"
      type="email"
      [required]="true"
      [(value)]="emailValue"
      [error]="!!emailError()"
      [errorText]="emailError()"
    />

    @if (errorMessage(); as msg) {
      <div
        role="alert"
        class="ul-py-2 ul-px-3 ul-bg-grey-lvl-1 ul-border-red ul-rounded-3 ul-text-red auth-form__error-banner"
      >
        {{ msg }}
      </div>
    }

    <ul-button
      theme="fill-purple"
      size="md"
      type="button"
      [disabled]="isLoading()"
      (buttonClick)="onSubmit()"
    >
      {{ sendButtonLabel() }}
    </ul-button>

    <ul-button class="ul-mt-4" theme="outline-white" size="md" type="button" routerLink="/login">
      <ng-container i18n="@@auth.backToSignIn">Back to Sign In</ng-container>
    </ul-button>
  </div>
} @else {
  <ul-status status="pending" customIcon="mail">
    <div ul-status-title i18n="@@forgotPassword.checkInbox">Check your inbox</div>
    <div ul-status-description i18n="@@forgotPassword.linkSent">We sent a password reset link.</div>
  </ul-status>

  <ul-button theme="outline-white" size="md" type="button" routerLink="/login">
    <ng-container i18n="@@auth.backToSignIn">Back to Sign In</ng-container>
  </ul-button>
}
