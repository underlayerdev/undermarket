@if (!successMessage()) {
  <h1 class="ul-typography-headline-l-extrablack ul-mb-1 auth-title">Reset your password</h1>
  <p class="ul-typography-body-m-regular ul-mb-6 ul-text-secondary auth-subtitle">
    Enter your email and we'll send you a reset link.
  </p>

  <div class="ul-gap-4 auth-form">
    <ul-input
      label="Email"
      placeholder="you@example.com"
      type="email"
      [required]="true"
      [(value)]="emailValue"
      [error]="!!emailError()"
      [errorText]="emailError()"
    />

    @if (errorMessage(); as msg) {
      <div
        role="alert"
        class="ul-py-2 ul-px-3 ul-bg-grey-lvl-1 ul-border-red ul-rounded-3 ul-text-red auth-form__error-banner"
      >
        {{ msg }}
      </div>
    }

    <ul-button
      theme="fill-purple"
      size="md"
      type="button"
      [disabled]="isLoading()"
      (buttonClick)="onSubmit()"
    >
      {{ isLoading() ? 'Sending...' : 'Send Reset Link' }}
    </ul-button>

    <p class="ul-typography-caption-l-regular ul-text-secondary auth-form__footer">
      <a routerLink="/login">← Back to Sign In</a>
    </p>
  </div>
} @else {
  <div class="ul-gap-3 ul-py-4 auth-success">
    <div class="ul-icon-size-12 auth-success__icon" aria-hidden="true">✉️</div>
    <h2 class="ul-typography-headline-m-extrabold">Check your inbox</h2>
    <p class="ul-typography-body-m-regular">{{ successMessage() }}</p>
    <a
      routerLink="/login"
      class="ul-typography-body-m-regular ul-mt-2 ul-text-secondary auth-success__link"
      >Back to Sign In</a
    >
  </div>
}
