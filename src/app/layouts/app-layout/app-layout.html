<div class="app-shell" *transloco="let t">
  <um-sidebar-layout
    [currentUrl]="currentUrl()"
    [(sidebarOpen)]="sidebarOpen"
    (logout)="onSignOut()"
    (login)="navigateToLogin()"
  />

  <div class="app-shell__body">
    <um-navbar-layout
      class="app-shell__navbar"
      [sidebarOpen]="sidebarOpen()"
      [currentUser]="currentUser()"
      (toggleSidebar)="sidebarOpen.update((open) => !open)"
      (submitSearch)="onSearchSubmit($event)"
    />
    <ul-dock>
      <ul-dock-item icon="home" routerLink="/home" routerLinkActive="ul-dock-item--active" />

      <ul-dock-item
        icon="view_grid"
        routerLink="/discover"
        routerLinkActive="ul-dock-item--active"
      />

      <ul-dock-item
        variant="accent"
        routerLink="/listings/new"
        routerLinkActive="ul-dock-item--active"
      >
        <span ul-dock-item-content class="app-shell__dock-new-listing">
          <ul-icon icon="plus" size="6" />
        </span>
      </ul-dock-item>
      <um-notifications layout="dock" />
      <ul-dock-item routerLink="/profile" routerLinkActive="ul-dock-item--active">
        <ul-avatar
          [src]="userImage()"
          [initials]="avatarInitials()"
          size="md"
          ul-dock-item-content
        />
      </ul-dock-item>
    </ul-dock>

    <main class="app-shell__main">
      <div class="app-shell__content ul-content">
        <router-outlet />
        <um-footer class="app-shell__footer" />
      </div>
    </main>
  </div>
</div>

<ul-toast-container />
