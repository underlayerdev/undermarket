<ng-container *transloco="let t">
  <div class="um-search-location-bar">
    <div class="um-search-location-bar__selected-location">
      @if (searchLocation(); as location) {
        <div class="um-search-location-bar__selected-location__display">
          <ul-icon icon="map_pin" size="5" />
          <span class="ul-typography-body-m-extrabold">
            {{ location.displayName }}
          </span>
        </div>

        <ul-icon
          icon="minus_small"
          size="4"
          class="um-search-location-bar__selected-location__separator"
        />
        <span class="ul-typography-caption-l-regular">{{ withinRadiusLabel() }}</span>
      } @else {
        <span class="ul-typography-body-l-regular">{{ t('location.changeLocation') }}</span>
      }
    </div>
    <ul-button
      theme="outline-white"
      type="button"
      size="sm"
      [disabled]="open()"
      [ariaLabel]="t('location.changeLocation')"
      (buttonClick)="open.set(true)"
    >
      {{ t('location.changeLocation') }}
    </ul-button>
  </div>

  <ul-modal
    [(open)]="open"
    [title]="isFirstRun() ? t('location.firstRunTitle') : t('location.changeLocation')"
    [fullScreenInMobile]="true"
    [closeOnBackdropClick]="!isFirstRun()"
    [showCloseButton]="!isFirstRun()"
  >
    <um-location-picker
      [searchLocation]="searchLocation()"
      [placeholder]="t('location.searchPlaceholder')"
      [suggestions]="locationSuggestions()"
      [isResolvingCurrentLocation]="isResolvingCurrentLocation()"
      [radiusOptions]="radiusOptions()"
      [resolvedCurrentArea]="resolvedCurrentArea()"
      (queryChanged)="onQueryChanged($event)"
      (useCurrentLocationRequested)="onUseCurrentLocationRequested()"
      (confirmed)="onConfirmed($event)"
    />
  </ul-modal>
</ng-container>
